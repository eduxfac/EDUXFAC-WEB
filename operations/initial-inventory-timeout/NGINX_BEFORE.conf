server {
    listen 80;
    server_name app.eduxfac.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/eduxfac-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://app.eduxfac.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name app.eduxfac.com;
    ssl_certificate /etc/letsencrypt/live/eduxfac.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduxfac.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 30m;
    location ^~ /api/internal/admin/v1 {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
